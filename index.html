<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CBT Informatika Kelas 9 — Word & Excel</title>
<style>
:root{--bg:#f2f6fd;--card:#fff;--ink:#1c2740;--mut:#5d6b88;--pri:#2457d6;--pri2:#1b43a8;--soft:#e8efff;--ok:#16a34a;--okbg:#e7f7ee;--warn:#d97706;--warnbg:#fff4e0;--bad:#dc2626;--badbg:#fdeaea;--line:#dfe6f3;--r:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px}
h1,h2,h3{line-height:1.25;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 2px 10px rgba(36,87,214,.06)}
.btn{border:0;border-radius:12px;padding:.75rem 1.2rem;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;transition:.15s;font-size:1rem}
.btn:hover{background:var(--pri2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.btn.ghost:hover{background:var(--soft)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.gray{background:#e9edf5;color:var(--ink)}
.btn.sm{padding:.45rem .8rem;font-size:.9rem;border-radius:10px}
.tag{display:inline-block;border-radius:999px;padding:.15rem .7rem;font-size:.8rem;font-weight:700}
.tag.sec{background:var(--soft);color:var(--pri2)}
.tag.hots{background:var(--warnbg);color:var(--warn)}
.tag.kasus{background:#e6f6f4;color:#0f766e}
.wrap{max-width:880px;margin:0 auto;padding:1.2rem}

/* ---------- Halaman awal ---------- */
.hero{background:linear-gradient(135deg,#2457d6 0%,#3d7bf0 55%,#19b3a6 120%);color:#fff;border-radius:22px;padding:2rem 1.5rem;text-align:center;position:relative;overflow:hidden}
.hero .ico{font-size:2.6rem;letter-spacing:.4rem}
.hero h1{font-size:clamp(1.5rem,4.5vw,2.2rem);margin:.4rem 0 .3rem}
.hero p{margin:.2rem 0;opacity:.95}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:1rem}
.chips span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:.3rem .9rem;font-size:.9rem;font-weight:600}
.grid2{display:grid;gap:1rem;margin-top:1rem}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.pad{padding:1.2rem 1.3rem}
.pad h2{font-size:1.15rem;margin-bottom:.7rem}
.rules{margin:0;padding-left:1.2rem}.rules li{margin:.45rem 0}
.rules b.r{color:var(--bad)}
.field{margin-bottom:.9rem}
.field label{display:block;font-weight:600;margin-bottom:.25rem;font-size:.95rem}
.field input,.field select{width:100%;padding:.7rem .8rem;border:1.5px solid var(--line);border-radius:12px;background:#fbfcff;outline:none}
.field input:focus,.field select:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(36,87,214,.15)}
.agree{display:flex;gap:.6rem;align-items:flex-start;font-size:.93rem;margin:.4rem 0 1rem}
.agree input{margin-top:.3rem;width:1.1rem;height:1.1rem}
.err{background:var(--badbg);color:var(--bad);border:1px solid #f4c0c0;border-radius:12px;padding:.7rem .9rem;margin-bottom:.9rem;font-weight:600}
.foot{text-align:center;color:var(--mut);font-size:.85rem;margin:1.4rem 0 .5rem}
.foot a{color:var(--mut);cursor:pointer;text-decoration:underline}

/* ---------- Halaman ujian ---------- */
.xbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:.5rem .9rem;align-items:center;justify-content:space-between;padding:.6rem 1rem}
.xbar .who{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.xbar .who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.xbar .who span{font-size:.8rem;color:var(--mut)}
.chip{background:var(--soft);border-radius:999px;padding:.35rem .9rem;font-weight:700;white-space:nowrap}
.chip.timer{font-variant-numeric:tabular-nums}
.chip.low{background:var(--badbg);color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.hearts{letter-spacing:.1rem}
.pbar{height:6px;background:#e5ebf7}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#19b3a6);width:0;transition:.3s}
.xwrap{max-width:1100px;margin:0 auto;padding:1rem;display:grid;gap:1rem}
@media(min-width:920px){.xwrap{grid-template-columns:1fr 290px;align-items:start}.nav{position:sticky;top:84px}}
.q{padding:1.3rem 1.4rem}
.qhead{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.9rem}
.qno{font-weight:800;font-size:1.1rem;color:var(--pri)}
.stim{background:#f6f9ff;border-left:4px solid var(--pri);border-radius:10px;padding:.8rem 1rem;margin-bottom:.9rem;white-space:pre-line}
.qtext{font-size:1.1rem;font-weight:600;margin:.2rem 0 .5rem}
.hint{color:var(--mut);font-size:.9rem;margin-bottom:.8rem}
.opts{display:grid;gap:.6rem}
.opt{display:flex;gap:.8rem;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:.75rem .9rem;cursor:pointer;background:#fff;transition:.12s}
.opt:hover{border-color:var(--pri);background:#f7faff}
.opt.sel{border-color:var(--pri);background:var(--soft)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .lt{flex:none;width:2rem;height:2rem;border-radius:50%;background:#eef2fb;display:grid;place-items:center;font-weight:800;color:var(--pri2)}
.opt.sel .lt{background:var(--pri);color:#fff}
.opt.chk .lt{border-radius:8px}
.opt .tx{padding-top:.2rem}
.pair{display:grid;gap:.4rem;padding:.8rem;border:1.5px solid var(--line);border-radius:14px;margin-bottom:.6rem}
@media(min-width:700px){.pair{grid-template-columns:1fr 1fr;align-items:center;gap:1rem}}
.pair .pl{font-weight:600}
.pair select{width:100%;padding:.65rem;border-radius:10px;border:1.5px solid var(--line);background:#fbfcff}
.pair.done{border-color:var(--pri);background:#f7faff}
.qfoot{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;margin-top:1.2rem;padding-top:1rem;border-top:1px dashed var(--line)}
.qfoot .btn.flag.on{background:var(--warn);color:#fff;border-color:var(--warn)}
.nav{padding:1rem}
.nav h3{font-size:1rem;margin-bottom:.6rem}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:.4rem}
.nb{height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;cursor:pointer;position:relative}
.nb.ans{background:var(--pri);color:#fff;border-color:var(--pri)}
.nb.flg{background:var(--warn);color:#fff;border-color:var(--warn)}
.nb.cur{outline:3px solid #19b3a6;outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.8rem;color:var(--mut);margin:.8rem 0}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:4px;margin-right:.3rem;vertical-align:-1px;border:1px solid var(--line)}
.noselect,.noselect *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* ---------- Modal & toast ---------- */
.ov{position:fixed;inset:0;background:rgba(18,28,56,.62);display:grid;place-items:center;z-index:100;padding:1rem;backdrop-filter:blur(3px)}
.modal{background:#fff;border-radius:20px;max-width:520px;width:100%;padding:1.5rem;max-height:92vh;overflow:auto;text-align:center}
.modal.left{text-align:left}
.micon{font-size:3rem;line-height:1}
.modal h3{font-size:1.3rem;margin:.5rem 0}
.mbody{color:var(--ink);margin-bottom:1rem}
.macts{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
.modal textarea{width:100%;min-height:140px;border:1.5px solid var(--line);border-radius:12px;padding:.7rem;font-family:ui-monospace,Consolas,monospace;font-size:.85rem}
.modal input[type=password],.modal input[type=text]{width:100%;padding:.7rem;border:1.5px solid var(--line);border-radius:12px}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%) translateY(120px);background:#1c2740;color:#fff;padding:.7rem 1.1rem;border-radius:12px;z-index:200;transition:.3s;max-width:92vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ---------- Hasil ---------- */
.res{text-align:center;padding:1.8rem 1.3rem}
.big{font-size:4.2rem;font-weight:900;line-height:1;margin:.5rem 0;color:var(--pri)}
.big.ok{color:var(--ok)}.big.bad{color:var(--bad)}
.badge{display:inline-block;padding:.35rem 1rem;border-radius:999px;font-weight:800}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.warn{background:var(--warnbg);color:var(--warn)}
table.t{border-collapse:collapse;width:100%;font-size:.92rem}
table.t th,table.t td{border:1px solid var(--line);padding:.45rem .6rem;text-align:left}
table.t th{background:#eef3ff;position:sticky;top:0;white-space:nowrap}
table.t td.n,table.t th.n{text-align:center}
#rekap td{white-space:nowrap}
.codebox{background:#f6f8fc;border:1px dashed #aab7d4;border-radius:12px;padding:.7rem;font-family:ui-monospace,Consolas,monospace;font-size:.75rem;word-break:break-all;max-height:110px;overflow:auto;text-align:left}

/* ---------- Panel guru ---------- */
.tp{max-width:1250px;margin:0 auto;padding:1rem}
.tp .top{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;align-items:center;margin-bottom:1rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.7rem;margin-bottom:1rem}
.stat{padding:.8rem 1rem}.stat b{display:block;font-size:1.6rem;color:var(--pri)}.stat span{color:var(--mut);font-size:.85rem}
.tools{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.8rem}
.tools select,.tools input{padding:.5rem .7rem;border:1.5px solid var(--line);border-radius:10px}
.tscroll{overflow:auto;max-height:68vh;border-radius:12px}
.st-selesai{color:var(--ok);font-weight:700}.st-waktu{color:var(--warn);font-weight:700}.st-pelanggaran{color:var(--bad);font-weight:700}
.empty{text-align:center;color:var(--mut);padding:2rem}

@media print{
  body.exam #app,body.exam #modalRoot{display:none!important}
  body.printing .tools,body.printing .top,body.printing .stats,body.printing .noprint{display:none!important}
  body{background:#fff}.card{box-shadow:none;border:0}.tscroll{max-height:none;overflow:visible}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toast"></div>

<script>
/* =====================================================================
   DATA-SOAL.JS  —  Pengaturan & Bank Soal
   Guru cukup mengedit file ini (tidak perlu menyentuh index.html).
   ===================================================================== */

const CONFIG = {
  // ---------- Identitas ----------
  judul: "Sumatif Harian Informatika",
  subjudul: "Microsoft Word & Excel — Pengolahan, Analisis, dan Integrasi Data",
  sekolah: "SMP Negeri 1 Lamongan",          // ← ganti nama sekolah
  guru: "Elis Fitrianingsih, S.Kom., M.Kom.",                // ← ganti nama guru
  mapel: "Informatika",
  tingkat: "Kelas 9",
  daftarKelas: ["9A", "9B", "9C", "9D", "9E", "9F", "9G", "9H", "9I", "9J", "9K"],

  // ---------- Aturan ujian ----------
  durasiMenit: 60,          // waktu mengerjakan
  kkm: 82,                  // batas ketuntasan
  maksPelanggaran: 3,       // jumlah kesempatan; pelanggaran ke-3 = ujian dihentikan
  wajibLayarPenuh: true,    // minta mode layar penuh (di HP/tablet tertentu tidak didukung → otomatis dilewati)
  satuKaliPerSiswa: true,   // siswa (nama+kelas+absen) hanya boleh mengerjakan 1x per perangkat
  kodeUjian: "",            // isi mis. "INFO9" bila ingin siswa memasukkan kode ujian dari guru; kosong = tanpa kode
  tampilkanNilaiKeSiswa: true,   // false = siswa tidak melihat nilai setelah selesai
  tampilkanKodeHasil: true,      // kode cadangan yang bisa dikirim siswa ke guru (lihat README)

  // ---------- Panel guru ----------
  passwordGuru: "guru123",  // ← WAJIB diganti. (Catatan: web statis → ini hanya pengaman ringan, bukan keamanan sungguhan)
  garam: "ganti-teks-rahasia-ini",  // teks bebas untuk tanda-tangan kode hasil

  // ---------- Pengumpulan nilai otomatis (opsional) ----------
  sheetsUrl: "",            // URL Google Apps Script (lihat README). Kosong = nilai hanya di perangkat siswa/guru

  // ---------- Bobot skor (total dinormalkan ke 100) ----------
  poin: { pg: 2, kompleks: 4, jodoh: 4 }   // 30×2 + 5×4 + 5×4 = 100
};

/* =====================================================================
   BANK SOAL — 40 butir: 20 butir bersumber dari modul "Latihan Excel dan Laporan Word Kelas 9"
   (data survei 10 siswa) dan 20 butir disusun dari Capaian Pembelajaran (CP).
   Komposisi: HOTS 4 butir (10%, C5); 36 butir lainnya C2–C4.
   Catatan: pemisah argumen rumus bisa ; atau , mengikuti pengaturan komputer.
   hots:true / kasus:true / lvl (C1–C6) hanya penanda untuk guru (TIDAK ditampilkan ke siswa);
   stim = teks kasus / stimulus.
   ===================================================================== */

/* A. PILIHAN GANDA (30 soal) — a = indeks jawaban benar (0 = opsi pertama) */
const SOAL_PG = [
  { lvl: 'C2', q: "Fungsi Freeze Panes pada baris pertama tabel data (baris judul) adalah …",
    o: ["Menghapus baris judul dari tabel", "Menggabungkan seluruh sel pada baris judul", "Mengunci baris judul agar tetap terlihat saat tabel digulir ke bawah", "Mengubah baris judul menjadi grafik"], a: 2 },
  { lvl: 'C3', q: "Data jam gawai berada di D2:D11. Rumus untuk menghitung rata-rata jam gawai per hari adalah …",
    o: ["=SUM(D2:D11)", "=AVERAGE(D2:D11)", "=MAX(D2:D11)", "=COUNT(D2:D11)"], a: 1 },
  { lvl: 'C3', q: "Siswa dinyatakan tuntas bila nilai ≥ 75. Rumus untuk menghitung banyak siswa tuntas pada F2:F11 adalah …",
    o: ["=COUNTIF(F2:F11;\">=75\")", "=COUNT(F2:F11;75)", "=SUM(F2:F11>=75)", "=IF(F2:F11>=75)"], a: 0 },
  { lvl: 'C3', q: "Kolom Keterangan diisi “Tuntas” bila nilai ≥ 75 dan “Remedial” bila kurang. Rumus yang tepat untuk sel G2 adalah …",
    o: ["=IF(F2>=75;\"Remedial\";\"Tuntas\")", "=IF(F2<=75;\"Tuntas\";\"Remedial\")", "=IF(F2>=75;\"Tuntas\";\"Remedial\")", "=COUNTIF(F2;\"Tuntas\")"], a: 2 },
  { lvl: 'C2', q: "Untuk membandingkan rata-rata nilai Kelas A dan Kelas B, jenis grafik yang tepat adalah …",
    o: ["Diagram batang (clustered column)", "Diagram sebar (scatter)", "Diagram lingkaran", "Diagram radar"], a: 0 },
  { lvl: 'C2', q: "Untuk melihat pola hubungan antara jam gawai (sumbu X) dan nilai Informatika (sumbu Y), jenis grafik yang paling tepat adalah …",
    o: ["Diagram lingkaran", "Diagram sebar (scatter) dengan garis tren", "Diagram batang bertumpuk", "Diagram donat"], a: 1 },
  { lvl: 'C2', q: "Pada laporan, keterangan otomatis (Insert Caption) diletakkan …",
    o: ["Tabel: di atas tabel; gambar: di bawah gambar", "Tabel: di bawah tabel; gambar: di atas gambar", "Selalu di bawah, baik tabel maupun gambar", "Selalu di halaman terakhir"], a: 0 },
  { kasus: true, lvl: 'C4', 
    stim: "Kategori gawai: Rendah = 2 jam atau kurang, Sedang = 3 sampai 4 jam, Tinggi = 5 jam atau lebih. Jam gawai siswa ada di D2.",
    q: "Rumus IF bertingkat yang benar untuk kolom Kategori_Gawai adalah …",
    o: ["=IF(D2<=4;\"Sedang\";IF(D2<=2;\"Rendah\";\"Tinggi\"))", "=IF(D2<=2;\"Rendah\";IF(D2<=4;\"Sedang\";\"Tinggi\"))", "=IF(D2<2;\"Rendah\";IF(D2<4;\"Sedang\";\"Tinggi\"))", "=IF(D2>=5;\"Rendah\";IF(D2>=3;\"Sedang\";\"Tinggi\"))"], a: 1 },
  { kasus: true, lvl: 'C3', 
    stim: "Pada data survei, Rani menyaring (Filter) siswa dengan jam gawai ≥ 4: Ayu (70), Dimas (75), Eka (65), Hadi (60), dan Joko (78).",
    q: "Jumlah siswa dan rata-rata nilai hasil penyaringan tersebut adalah …",
    o: ["5 siswa, rata-rata 78,6", "5 siswa, rata-rata 69,6", "4 siswa, rata-rata 69,6", "3 siswa, rata-rata 65,0"], a: 1 },
  { kasus: true, lvl: 'C4', 
    stim: "Hadi ternyata salah dicatat. Nilainya diperbaiki di Excel dari 60 menjadi 72. Sebelumnya rata-rata nilai 78,6 dan 7 siswa tuntas.",
    q: "Setelah perbaikan, pernyataan yang benar adalah …",
    o: ["Rata-rata nilai tetap 78,6", "Rata-rata nilai menjadi 79,8 dan jumlah siswa tuntas tetap 7", "Jumlah siswa tuntas menjadi 8", "Nilai terendah tetap 60"], a: 1 },
  { kasus: true, lvl: 'C4', 
    stim: "Di laporan Word, Grafik 1 ditempel dengan Keep Source & Link Data, Grafik 2 sebagai Picture, dan Grafik 3 dengan Embed Workbook. Setelah nilai di Excel diubah, pengguna memilih Update Link.",
    q: "Grafik yang ikut berubah mengikuti data Excel adalah …",
    o: ["Grafik 2 (Picture)", "Grafik 3 (Embed Workbook)", "Grafik 1 (tertaut)", "Ketiga grafik berubah"], a: 2 },
  { kasus: true, lvl: 'C3', 
    stim: "Laporan akan dikirim ke wali kelas lewat e-mail tanpa menyertakan file Excel asli, tetapi grafiknya masih harus dapat diedit datanya di Word.",
    q: "Metode tempel yang paling tepat adalah …",
    o: ["Picture (gambar)", "Keep Source & Link Data (tertaut)", "Embed Workbook (tersemat)", "Mengetik ulang grafik secara manual"], a: 2 },
  { kasus: true, lvl: 'C3', 
    stim: "Laporan memiliki sampul, daftar isi, dan isi. Nomor halaman hanya boleh muncul mulai halaman isi, bukan pada sampul.",
    q: "Langkah yang paling tepat adalah …",
    o: ["Menekan Enter berkali-kali sampai nomor tampil di halaman isi", "Memisahkan sampul dengan Section Break, lalu memasang nomor halaman di footer mulai bagian isi", "Memberi warna putih pada nomor halaman sampul", "Menghapus sampul dari dokumen"], a: 1 },
  { hots: true, lvl: 'C5', 
    stim: "Koefisien korelasi jam gawai dan nilai pada data survei adalah sekitar −0,95.",
    q: "Tafsiran yang paling tepat adalah …",
    o: ["Hubungan negatif yang kuat: makin banyak jam gawai, nilai cenderung makin rendah, tetapi ini belum membuktikan sebab-akibat", "Hubungan positif yang kuat: makin banyak jam gawai, nilai makin tinggi", "Tidak ada hubungan sama sekali karena angkanya negatif", "Gawai pasti menjadi penyebab turunnya nilai setiap siswa"], a: 0 },
  { kasus: true, lvl: 'C4', 
    stim: "Hasil survei: rata-rata nilai Kelas A = 76,0 dengan rata-rata jam gawai 4,0 jam; Kelas B = 81,2 dengan rata-rata jam gawai 3,0 jam. Sampel hanya 10 siswa.",
    q: "Pernyataan yang paling tepat dan hati-hati adalah …",
    o: ["Kelas B bernilai lebih tinggi dan jam gawainya lebih sedikit, sejalan dengan pola korelasi, tetapi belum membuktikan sebab-akibat karena sampel kecil", "Gawai pasti membuat nilai Kelas A turun 5,2 poin", "Hasil ini berlaku untuk seluruh siswa di Indonesia", "Jam gawai tidak berhubungan sama sekali dengan nilai"], a: 0 },
  { lvl: 'C2', q: "Pernyataan yang tepat tentang data dan informasi adalah …",
    o: ["Daftar nilai mentah 30 siswa adalah data, sedangkan peringkat kelas hasil pengolahannya adalah informasi", "Peringkat kelas adalah data, sedangkan daftar nilai mentah adalah informasi", "Data dan informasi sama persis sehingga tidak perlu dibedakan", "Informasi tidak pernah berasal dari pengolahan data"], a: 0 },
  { kasus: true, lvl: 'C3',
    stim: "Guru ingin mengirim daftar nilai agar dapat dibuka di berbagai aplikasi spreadsheet (Excel, LibreOffice, Google Sheets) dengan ukuran berkas kecil dan hanya berisi data tabel.",
    q: "Format berkas yang paling tepat untuk keperluan tersebut adalah …",
    o: ["PPTX (.pptx)", "JPG (.jpg)", "CSV (.csv)", "DOCX (.docx)"], a: 2 },
  { kasus: true, lvl: 'C4',
    stim: "Tim literasi mengumpulkan jawaban formulir daring dari 120 siswa. Sebelum menghitung rata-rata, mereka menghapus 6 baris ganda dan memperbaiki penulisan nama kelas yang berbeda-beda (9A, 9 A, 9a).",
    q: "Alasan paling tepat mengapa pembersihan data dilakukan sebelum perhitungan adalah …",
    o: ["Agar tabel terlihat lebih berwarna", "Karena data ganda dan penulisan yang tidak seragam dapat membuat hasil perhitungan dan pengelompokan menjadi keliru", "Agar ukuran berkas menjadi lebih kecil sehingga cepat dikirim", "Karena Excel tidak dapat menghitung bila ada lebih dari 100 baris"], a: 1 },
  { lvl: 'C2', q: "Masalah dasar pemrosesan data berupa data yang sama tercatat berulang kali disebut …",

<script>
(function(){
'use strict';

/* =====================================================================
   UTILITAS
   ===================================================================== */
const $ = (s,r=document)=>r.querySelector(s);
function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){
    const v=attrs[k];
    if(v===false||v==null) continue;
    if(k==='class') e.className=v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
    else if(k==='value') e.value=v;
    else e.setAttribute(k,v===true?'':v);
  }
  kids.flat(Infinity).forEach(c=>{ if(c==null||c===false) return; e.append(c.nodeType?c:document.createTextNode(String(c))); });
  return e;
}
const mem={};
function load(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return (k in mem)?JSON.parse(mem[k]):d; } }
function save(k,v){ const s=JSON.stringify(v); try{ localStorage.setItem(k,s); }catch(e){ mem[k]=s; } }
function del(k){ try{ localStorage.removeItem(k); }catch(e){} delete mem[k]; }
function rnd(n){ if(window.crypto&&crypto.getRandomValues){ const a=new Uint32Array(1); crypto.getRandomValues(a); return Math.floor(a[0]/4294967296*n); } return Math.floor(Math.random()*n); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
const r1=x=>Math.round(x*10)/10;
const pad2=n=>String(n).padStart(2,'0');
const tgl=t=>{const d=new Date(t);return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear();};
const jam=t=>{const d=new Date(t);return pad2(d.getHours())+':'+pad2(d.getMinutes());};
const mmss=ms=>{ms=Math.max(0,Math.ceil(ms/1000));return pad2(Math.floor(ms/60))+':'+pad2(ms%60);};
const clean=s=>String(s||'').replace(/\s+/g,' ').trim();
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),2600); }
function fnv(str){ let h=0x811c9dc5; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h.toString(36); }

/* =====================================================================
   DATA SOAL → daftar butir bertipe
   ===================================================================== */
const C=CONFIG, P=C.poin;
const ITEMS=[];
SOAL_PG.forEach((s,i)=>ITEMS.push(Object.assign({id:'pg'+(i+1),type:'pg'},s)));
SOAL_KOMPLEKS.forEach((s,i)=>ITEMS.push(Object.assign({id:'kx'+(i+1),type:'kompleks'},s)));
SOAL_JODOH.forEach((s,i)=>ITEMS.push(Object.assign({id:'jd'+(i+1),type:'jodoh'},s)));
const BY={}; ITEMS.forEach(i=>BY[i.id]=i);
const MAX={pg:SOAL_PG.length*P.pg,kompleks:SOAL_KOMPLEKS.length*P.kompleks,jodoh:SOAL_JODOH.length*P.jodoh};
MAX.total=MAX.pg+MAX.kompleks+MAX.jodoh;
const SEC={pg:'A • Pilihan Ganda',kompleks:'B • Pilihan Ganda Kompleks',jodoh:'C • Menjodohkan'};
const K_RES='cbt9_hasil_v1',K_SES='cbt9_sesi_v1',K_OUT='cbt9_outbox_v1';
const STATUS={selesai:'Selesai',waktu:'Waktu habis',pelanggaran:'Dihentikan (pelanggaran)'};

/* =====================================================================
   STATE
   ===================================================================== */
let S=null;            // sesi ujian aktif
let active=false;      // ujian sedang berjalan?
let tm=null;           // interval timer
let ignoreUntil=0, lastViol=0;

function persist(){ if(S) save(K_SES,S); }

function newSession(info){
  const ids=t=>ITEMS.filter(i=>i.type===t).map(i=>i.id);
  const opt={};
  ITEMS.forEach(it=>{
    if(it.type==='jodoh') opt[it.id]={l:shuffle(it.pairs.map((_,i)=>i)),r:shuffle(it.pairs.map((_,i)=>i))};
    else opt[it.id]=shuffle(it.o.map((_,i)=>i));
  });
  return Object.assign({},info,{
    id:Date.now().toString(36)+rnd(1e6).toString(36),
    start:Date.now(),
    order:[].concat(shuffle(ids('pg')),shuffle(ids('kompleks')),shuffle(ids('jodoh'))),
    opt:opt,ans:{},flag:{},viol:[],cur:0,done:false
  });
}

/* =====================================================================
   PENILAIAN
   ===================================================================== */
function isAnswered(id){
  const it=BY[id],a=S.ans[id];
  if(it.type==='pg') return typeof a==='number';
  if(it.type==='kompleks') return Array.isArray(a)&&a.length>0;
  return !!a && it.pairs.every((_,i)=>typeof a[i]==='number');
}
function hitung(sess){
  let pgBenar=0,kx=0,jd=0,kxBenar=0,jdBenar=0;
  sess.order.forEach(id=>{
    const it=BY[id],a=sess.ans[id];
    if(it.type==='pg'){ if(a===it.a) pgBenar++; }
    else if(it.type==='kompleks'){
      const sel=Array.isArray(a)?a:[];
      const b=sel.filter(x=>it.a.indexOf(x)>-1).length, s=sel.length-b;
      const f=Math.max(0,(b-s)/it.a.length); kx+=f; if(f===1) kxBenar++;
    } else {
      const b=it.pairs.filter((_,i)=>a&&a[i]===i).length;
      jd+=b/it.pairs.length; if(b===it.pairs.length) jdBenar++;
    }
  });
  const sPg=pgBenar*P.pg, sKx=kx*P.kompleks, sJd=jd*P.jodoh;
  return {pgBenar,kxBenar,jdBenar,pg:r1(sPg),kompleks:r1(sKx),jodoh:r1(sJd),nilai:r1((sPg+sKx+sJd)/MAX.total*100)};
}

  const body=el('div',{class:'mbody'});

    el('div',{class:'macts'},(o.actions||[]).map(a=>el('button',{class:'btn '+(a.cls||''),onclick:a.fn},a.t))));
  $('#modalRoot').replaceChildren(el('div',{class:'ov'},box));
  return box;
}
function closeModal(){ $('#modalRoot').replaceChildren(); }
function mount(n){ $('#app').replaceChildren(n); window.scrollTo(0,0); }

/* =====================================================================

   ===================================================================== */

  active=false; document.body.classList.remove('exam','printing');
  const errBox=el('div',{class:'err',style:'display:none'});

  const fKelas=el('select',{id:'fk'},el('option',{value:''},'— pilih kelas —'),C.daftarKelas.map(k=>el('option',{value:k},k)));
  const fAbsen=el('input',{type:'number',id:'fa',min:'1',max:'99',inputmode:'numeric',placeholder:'mis. 12'});
  const fKode=C.kodeUjian?el('input',{type:'text',id:'fc',autocomplete:'off',placeholder:'Kode dari guru'}):null;
  const fAgree=el('input',{type:'checkbox',id:'fg'});
  const doStart=function(){
    const nama=clean(fNama.value),kelas=fKelas.value,absen=String(parseInt(fAbsen.value,10)||'');
    const fail=m=>{errBox.textContent='⚠️ '+m;errBox.style.display='block';errBox.scrollIntoView({block:'center'});};
    if(nama.length<3) return fail('Nama lengkap belum diisi.');
    if(!kelas) return fail('Pilih kelas terlebih dahulu.');
    if(!absen) return fail('Nomor absen belum diisi.');
    if(fKode && clean(fKode.value).toLowerCase()!==C.kodeUjian.toLowerCase()) return fail('Kode ujian salah. Tanyakan kepada guru.');
    if(!fAgree.checked) return fail('Centang kotak persetujuan terlebih dahulu.');
    const key=[nama.toLowerCase(),kelas,absen].join('|');
    if(C.satuKaliPerSiswa && load(K_RES,[]).some(r=>r.key===key))
      return fail('Kamu sudah mengerjakan ujian ini di perangkat ini. Jika ada masalah, hubungi guru.');
    S=newSession({nama:nama,kelas:kelas,absen:absen,key:key});
    persist(); try{enterFS();}catch(e){} beginExam();
  };
  const form=el('form',{class:'card pad',onsubmit:function(e){e.preventDefault();doStart();}},
    el('h2',{},'📝 Data Peserta'),
    el('div',{class:'field'},el('label',{for:'fn'},'Nama lengkap'),fNama),
    el('div',{class:'field'},el('label',{for:'fk'},'Kelas'),fKelas),

function violation(jenis){

  lastViol=now;
  S.viol.push({t:now,k:jenis}); persist(); renderHearts();

  showWarning(jenis);
}

function copyText(text,html){
  return new Promise(res=>{
    const legacy=()=>{ const t=el('textarea',{style:'position:fixed;opacity:0'}); t.value=text; document.body.append(t); t.select(); try{document.execCommand('copy');}catch(e){} t.remove(); res(); };
    try{

        navigator.clipboard.write([new ClipboardItem({'text/plain':new Blob([text],{type:'text/plain'}),'text/html':new Blob([html],{type:'text/html'})})]).then(res,legacy);

    const avg=nil.length?r1(nil.reduce((a,b)=>a+b,0)/nil.length):'–';
    const tuntas=rs.filter(r=>r.nilai>=C.kkm).length;
    body.replaceChildren(
      el('div',{class:'stats'},
        [['Peserta',rs.length],['Rata-rata',avg],['Tertinggi',nil.length?Math.max.apply(null,nil):'–'],['Terendah',nil.length?Math.min.apply(null,nil):'–'],['Tuntas',rs.length?tuntas+' ('+Math.round(tuntas/rs.length*100)+'%)':'–'],['Dihentikan',rs.filter(r=>r.status==='pelanggaran').length]]
          .map(s=>el('div',{class:'card stat'},el('b',{},s[1]),el('span',{},s[0])))),
      el('div',{class:'card pad'},
        el('div',{class:'tscroll'},rs.length?el('table',{class:'t',id:'rekap'},
          el('thead',{},el('tr',{},COLS.map(c=>el('th',{},c[0])),el('th',{class:'noprint'},'Aksi'))),
          el('tbody',{},rs.map((r,i)=>el('tr',{},
            COLS.map((c,ci)=>{ const v=c[1](r,i); const cls=ci===12?'st-'+r.status:(typeof v==='number'?'n':''); return el('td',{class:cls,title:ci===13&&r.jenis?r.jenis:null},v); }),
            el('td',{class:'noprint'},el('button',{class:'btn sm gray',title:'Hapus agar siswa dapat mengulang',onclick:()=>{
              modal({icon:'🗑️',title:'Hapus nilai ini?',body:r.nama+' ('+r.kelas+'). Siswa akan dapat mengerjakan ulang.',actions:[{t:'Batal',cls:'gray',fn:closeModal},{t:'Hapus',cls:'bad',fn:()=>{ save(K_RES,load(K_RES,[]).filter(x=>x.id!==r.id)); closeModal(); draw(); }}]});
            }},'Hapus')))))
        ):el('div',{class:'empty'},'Belum ada data nilai di perangkat ini.',el('br'),'Nilai muncul di sini setelah siswa menyelesaikan ujian di perangkat ini, atau setelah kamu mengimpor kode hasil.'))));
  }
  const selKelas=el('select',{onchange:function(){fKelas=this.value;draw();}},el('option',{value:''},'Semua kelas'),C.daftarKelas.map(k=>el('option',{value:k},k)));
  const cari=el('input',{type:'text',placeholder:'Cari nama…',oninput:function(){fCari=this.value;draw();}});
  const tools=el('div',{class:'tools'},selKelas,cari,
    el('button',{class:'btn sm',onclick:()=>{ const m=matrix(rows()); if(m.length<2) return toast('Belum ada data'); const blob=makeXlsx(m,'Rekap Nilai'); dl(blob,fname('xlsx')); }},'⬇ Unduh Excel (.xlsx)'),
    el('button',{class:'btn sm ghost',onclick:()=>{ const m=matrix(rows()); if(m.length<2) return toast('Belum ada data'); const tsv=m.map(r=>r.join('\t')).join('\n'); const html='<table border="1">'+m.map((r,i)=>'<tr>'+r.map(c=>'<'+(i?'td':'th')+'>'+esc(c)+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</table>'; copyText(tsv,html).then(()=>toast('Tabel disalin — tempel (Ctrl+V) di Excel / Word / Google Sheets')); }},'📋 Salin Tabel'),
    el('button',{class:'btn sm ghost',onclick:()=>{ document.body.classList.add('printing'); window.print(); setTimeout(()=>document.body.classList.remove('printing'),500); }},'🖨 Cetak'),
    el('button',{class:'btn sm ghost',onclick:importDlg},'📥 Impor Kode Hasil'),
    el('button',{class:'btn sm bad',onclick:()=>modal({icon:'⚠️',title:'Hapus SEMUA nilai?',body:'Semua rekap nilai di perangkat ini akan dihapus dan tidak dapat dikembalikan. Unduh dulu bila perlu.',actions:[{t:'Batal',cls:'gray',fn:closeModal},{t:'Hapus semua',cls:'bad',fn:()=>{del(K_RES);closeModal();draw();}}]})},'Hapus Semua'));
  root.append(el('div',{class:'top'},el('h2',{},'📊 Rekap Nilai — '+C.mapel+' '+C.tingkat),el('button',{class:'btn sm gray',onclick:viewWelcome},'← Kembali')),tools,body);
  mount(root); draw();
}
function quickDownload(){
  const rs=load(K_RES,[]).sort((a,b)=>a.kelas.localeCompare(b.kelas)||(Number(a.absen)-Number(b.absen))||a.mulai-b.mulai);
  if(!rs.length){ toast('Belum ada data nilai di perangkat ini'); return; }
  const m=[COLS.map(c=>c[0])].concat(rs.map((r,i)=>COLS.map(c=>c[1](r,i))));
  const d=new Date();
  dl(makeXlsx(m,'Rekap Nilai'),'Rekap_Nilai_Informatika_Kelas9_'+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'.xlsx');
  toast('File nilai diunduh ('+rs.length+' siswa)');
}
function dl(blob,name){ const a=el('a',{href:URL.createObjectURL(blob),download:name}); document.body.append(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); }
function importDlg(){
  const ta=el('textarea',{placeholder:'Tempel satu atau beberapa kode hasil (satu kode per baris)…'});
  modal({left:true,icon:'📥',title:'Impor Kode Hasil',body:[el('p',{class:'hint'},'Gunakan bila siswa mengerjakan di perangkat lain. Kode diawali “CBT1.”'),ta],
    actions:[{t:'Batal',cls:'gray',fn:closeModal},{t:'Impor',fn:()=>{
      const rs=load(K_RES,[]); let ok=0,dup=0,bad=0;
      ta.value.split(/\s+/).filter(Boolean).forEach(line=>{
        try{
          if(line.indexOf('CBT1.')!==0) throw 0;
          const o=JSON.parse(decodeURIComponent(escape(atob(line.slice(5)))));
          const sig=fnv([o.nama,o.kelas,o.absen,o.nilai,o.pelanggaran,C.garam].join('|'));
          if(o.sig!==sig) throw 0;
          delete o.sig;
          if(rs.some(r=>r.id===o.id)) dup++; else { rs.push(o); ok++; }
        }catch(e){ bad++; }
      });
      save(K_RES,rs); closeModal(); viewTeacher(); toast(ok+' diimpor, '+dup+' duplikat, '+bad+' tidak valid');
    }}]});
}

/* =====================================================================
   PEMBUAT FILE .XLSX (tanpa pustaka luar)
   ===================================================================== */
const CRCT=(function(){const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const u16=v=>[v&255,(v>>>8)&255],u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
  files.forEach(f=>{
    const nm=enc.encode(f.name),data=enc.encode(f.text),crc=crc32(data),sz=data.length;
    const lh=[0x50,0x4b,3,4].concat(u16(20),u16(0x0800),u16(0),u16(0),u16(0x21),u32(crc),u32(sz),u32(sz),u16(nm.length),u16(0));
    parts.push(new Uint8Array(lh),nm,data); cen.push({nm:nm,crc:crc,sz:sz,off:off}); off+=lh.length+nm.length+sz;
  });
  let cs=0;
  cen.forEach(c=>{
    const h=[0x50,0x4b,1,2].concat(u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0x21),u32(c.crc),u32(c.sz),u32(c.sz),u16(c.nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.off));
    parts.push(new Uint8Array(h),c.nm); cs+=h.length+c.nm.length;
  });
  parts.push(new Uint8Array([0x50,0x4b,5,6,0,0,0,0].concat(u16(files.length),u16(files.length),u32(cs),u32(off),[0,0])));
  return new Blob(parts,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function colName(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}
const xe=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function makeXlsx(m,sheet){
  const widths=m[0].map((h,ci)=>Math.min(40,Math.max(String(h).length*0.9,...m.slice(1).map(r=>String(r[ci]).length))+3));
  let sd='';
  m.forEach((r,ri)=>{
    sd+='<row r="'+(ri+1)+'"'+(ri===0?' ht="32" customHeight="1"':'')+'>';
    r.forEach((v,ci)=>{
      const ref=colName(ci)+(ri+1), st=ri===0?1:2;
      if(typeof v==='number'&&isFinite(v)) sd+='<c r="'+ref+'" s="'+st+'"><v>'+v+'</v></c>';
      else sd+='<c r="'+ref+'" s="'+st+'" t="inlineStr"><is><t xml:space="preserve">'+xe(v)+'</t></is></c>';
    });
    sd+='</row>';
  });
  const NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  const sheetXml=H+'<worksheet xmlns="'+NS+'"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols>'+
    widths.map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w.toFixed(1)+'" customWidth="1"/>').join('')+'</cols><sheetData>'+sd+'</sheetData></worksheet>';
  const bd='<border><left style="thin"><color rgb="FFBBBBBB"/></left><right style="thin"><color rgb="FFBBBBBB"/></right><top style="thin"><color rgb="FFBBBBBB"/></top><bottom style="thin"><color rgb="FFBBBBBB"/></bottom><diagonal/></border>';
  const styles=H+'<styleSheet xmlns="'+NS+'"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>'+
    '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF2457D6"/><bgColor indexed="64"/></patternFill></fill></fills>'+
    '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>'+bd+'</borders>'+
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    '<cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
    '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>'+
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"/></cellXfs></styleSheet>';
  return zipStore([
    {name:'[Content_Types].xml',text:H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
    {name:'_rels/.rels',text:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml',text:H+'<workbook xmlns="'+NS+'" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="'+xe(sheet)+'" sheetId="1" r:id="rId1"/></sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels',text:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:'xl/styles.xml',text:styles},
    {name:'xl/worksheets/sheet1.xml',text:sheetXml}
  ]);
}

function init(){
  document.title=C.judul+' — '+C.mapel+' '+C.tingkat;
  const s=load(K_SES,null);
  const valid=s&&!s.done&&Array.isArray(s.order)&&s.order.length===ITEMS.length&&s.order.every(id=>BY[id]);
  if(s&&!valid) del(K_SES);
  if(valid){
    S=s;
    if(Date.now()>=S.start+C.durasiMenit*60000){ finish('waktu'); }
    else {
      S.viol.push({t:Date.now(),k:'memuat ulang / menutup halaman ujian'}); persist();
      if(S.viol.length>=C.maksPelanggaran){ finish('pelanggaran'); }
      else { beginExam(); showWarning('memuat ulang / menutup halaman ujian',true); }
    }
  } else viewWelcome();
  flushOutbox();
}
init();
})();
